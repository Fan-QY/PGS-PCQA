name: pgs_pcqa
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.1.2
      - torchvision==0.16.2
      - numpy==1.26.4
      - scipy==1.15.3
      - pandas==2.3.3
      - pillow==12.2.0
      - ftfy==6.3.1
      - regex==2026.9.29
      - tqdm==4.67.3
      - lightly==1.5.2
      - thop==0.1.1.post2209072238
      - scikit-learn==1.7.2
      - open3d==0.19.0
      - opencv-python==4.13.0.92
      - matplotlib==3.10.9
# install the CUDA build of torch 2.1.2 (the runs used CUDA 11.8); pytorch3d 0.7.5 (rendering only) must be installed
# separately for the chosen torch / CUDA build
